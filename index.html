confirmedList.innerHTML = data
  .map(guest => `<div class="guest-name">${escapeHtml(guest.nome)}</div>`)

por:
confirmedList.innerHTML = data
  .map(guest => {
    const total = Number(guest.acompanhantes ?? 1);
    const peopleText =
      total === 1 ? "1 pessoa na família" : `${total} pessoas na família`;

    return `<div class="guest-name">
      <span>${escapeHtml(guest.nome)}</span>
      <span class="guest-family">- ${peopleText}</span>
    </div>`;
  })
  .join("");
